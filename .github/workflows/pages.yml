# Публікація 3D-сторінки (tools/viewer-wasm) на GitHub Pages.
#
# Сторінка вшиває сам OpenSCAD під GPL-2.0, тому разом із нею викладаються текст ліцензії
# і THIRD-PARTY.md із посиланням на вихідні коди — цього вимагає §1 і §3 GPL-2.0.
# У самій сторінці внизу панелі є ті самі посилання (ключ `lic` у src/i18n.js).
#
# Увімкнути один раз: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # можна запустити вручну зі вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Одне розгортання за раз; нове не скасовує те, що вже публікується.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/viewer-wasm/package-lock.json

      - name: Встановити залежності
        working-directory: tools/viewer-wasm
        run: npm ci

      # Захист від публікації зламаної моделі: тест будує її рушієм сторінки
      # і валиться на будь-якому попередженні, порожній деталі чи розходженні перекладу.
      - name: Перевірити модель і сторінку
        working-directory: tools/viewer-wasm
        run: npm test

      - name: Зібрати сайт
        working-directory: tools/viewer-wasm
        run: npm run build

      - name: Додати обов'язкові за GPL файли
        run: |
          cp tools/viewer-wasm/LICENSE tools/viewer-wasm/dist/LICENSE
          cp THIRD-PARTY.md            tools/viewer-wasm/dist/THIRD-PARTY.md
          ls -lh tools/viewer-wasm/dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/viewer-wasm/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
