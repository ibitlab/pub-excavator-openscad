<text x="820.0" y="236.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#212121">МОТОР (PHI)</text>
<circle cx="640.0" cy="296.0" r="26.0" fill="#eceff1" stroke="#212121" stroke-width="1.5"/>
<circle cx="640.0" cy="296.0" r="12.0" fill="white" stroke="#212121" stroke-width="1.5"/>
<text x="640.0" y="340.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">ніс, шпилька</text>
<line x1="640.0" y1="214.0" x2="640.0" y2="176.0" stroke="#e0e0e0" stroke-width="22"/>
<polygon points="666.6,253.5 613.4,253.5 613.4,214.5 666.6,214.5" fill="#546e7a" stroke="#212121" stroke-width="1.5"/>
<line x1="656.5" y1="214.5" x2="656.5" y2="179.4" stroke="#2e7d32" stroke-width="2.5"/>
<text x="656.5" y="170.4" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">OUT</text>
<line x1="640.0" y1="214.5" x2="640.0" y2="179.4" stroke="#37474f" stroke-width="2.5"/>
<text x="640.0" y="159.4" font-size="10" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
