<text x="510.4" y="283.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">OUT</text>
<line x1="558.5" y1="296.0" x2="523.4" y2="296.0" stroke="#37474f" stroke-width="2.5"/>
<text x="510.4" y="300.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
<line x1="558.5" y1="312.5" x2="523.4" y2="312.5" stroke="#c62828" stroke-width="2.5"/>
<text x="510.4" y="316.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">VS</text>
<text x="578.0" y="300.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#eceff1">зворот</text>
<text x="502.0" y="266.0" font-size="12" text-anchor="end" font-weight="bold" fill="#212121">латч B</text>
<text x="502.0" y="281.0" font-size="10" text-anchor="end" font-weight="normal" fill="#616161">PHI + 180°</text>
<text x="1150.0" y="140.0" font-size="11" text-anchor="end" font-weight="bold" fill="#212121">Маркування — ДО ШЕСТЕРНІ (вглиб</text>
<text x="1150.0" y="156.0" font-size="11" text-anchor="end" font-weight="normal" fill="#212121">гнізда); видно зворот. Ніжки — у</text>
<text x="1150.0" y="172.0" font-size="11" text-anchor="end" font-weight="normal" fill="#212121">канавку назовні (гніздо на R 5.75 мм,</text>
<text x="1150.0" y="188.0" font-size="11" text-anchor="end" font-weight="normal" fill="#212121">навпроти магнітів шестерні).</text>
<text x="1150.0" y="212.0" font-size="11" text-anchor="end" font-weight="normal" fill="#616161">Переплутав A і B — лише знак</text>
<text x="1150.0" y="228.0" font-size="11" text-anchor="end" font-weight="normal" fill="#616161">напрямку в прошивці.</text>
<text x="960.0" y="262.0" font-size="11" text-anchor="start" font-weight="bold" fill="#212121">переріз по латчу:</text>
<rect x="960.0" y="274.0" width="60.0" height="110.0" rx="0" fill="#ffcc80" stroke="#212121" stroke-width="1.5"/>
<text x="990.0" y="400.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">шестерня</text>
<rect x="1008.0" y="300.0" width="12.0" height="20.0" rx="0" fill="#c62828" stroke="#212121" stroke-width="1.5"/>
<text x="1002.0" y="314.0" font-size="10" text-anchor="end" font-weight="bold" fill="#c62828">N</text>
<rect x="1008.0" y="340.0" width="12.0" height="20.0" rx="0" fill="#1565c0" stroke="#212121" stroke-width="1.5"/>
<text x="1002.0" y="354.0" font-size="10" text-anchor="end" font-weight="bold" fill="#1565c0">S</text>
<rect x="1030.0" y="274.0" width="34.0" height="110.0" rx="0" fill="#90caf9" stroke="#212121" stroke-width="1.5"/>
<text x="1047.0" y="400.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">стінка</text>
<rect x="1046.0" y="298.0" width="16.0" height="30.0" rx="0" fill="#263238" stroke="#212121" stroke-width="1.5"/>
<line x1="1048.0" y1="298.0" x2="1048.0" y2="328.0" stroke="#ffca28" stroke-width="3"/>
<line x1="1110.0" y1="313.0" x2="1068.0" y2="313.0" stroke="#212121" stroke-width="1.5"/>
<polygon points="1068.0,313.0 1077.2,309.1 1077.2,316.9" fill="#212121"/>
<text x="1114.0" y="309.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212121">маркування</text>
<text x="1114.0" y="322.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212121">до шестерні</text>
<rect x="30.0" y="432.0" width="1140.0" height="460.0" rx="6" fill="#fafafa" stroke="#212121" stroke-width="1.5"/>
<text x="46.0" y="456.0" font-size="13" text-anchor="start" font-weight="bold" fill="#212121">3. Кінцевики: 2 × SS49E на боці PHI + 180° (навпроти мотора) — вид ззовні на прилив, голова праворуч</text>
<rect x="150.0" y="560.0" width="780.0" height="80.0" rx="0" fill="#455a64" stroke="#212121" stroke-width="1.5"/>
<rect x="150.0" y="574.0" width="780.0" height="52.0" rx="0" fill="#78909c" stroke="#212121" stroke-width="0"/>
<rect x="70.0" y="544.0" width="110.0" height="112.0" rx="0" fill="#546e7a" stroke="#212121" stroke-width="1.5"/>
<text x="125.0" y="678.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#616161">задня кришка</text>
<circle cx="70.0" cy="600.0" r="0.1" fill="#212121" stroke="#212121" stroke-width="1.5"/>
<rect x="930.0" y="490.0" width="120.0" height="220.0" rx="0" fill="#90caf9" stroke="#212121" stroke-width="1.5"/>
<text x="990.0" y="732.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#616161">голова</text>
<rect x="930.0" y="490.0" width="16.0" height="34.0" rx="0" fill="white" stroke="#212121" stroke-width="1.5"/>
<text x="952.0" y="516.0" font-size="10" text-anchor="start" font-weight="normal" fill="#616161">виріз під дроти</text>
<line x1="150.0" y1="630.0" x2="930.0" y2="630.0" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5 4"/>
<text x="540.0" y="626.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#eceff1">канавка під дроти «зведеного» — уздовж гільзи, на 60° від осі датчиків, збоку від приливу</text>
<rect x="90.0" y="516.0" width="90.0" height="44.0" rx="0" fill="#b0bec5" stroke="#212121" stroke-width="1.5"/>
<line x1="157.0" y1="592.0" x2="200.0" y2="592.0" stroke="#e0e0e0" stroke-width="16"/>
<polygon points="120.0,612.5 120.0,571.5 150.0,571.5 150.0,612.5" fill="#546e7a" stroke="#212121" stroke-width="1.5"/>
<line x1="150.0" y1="604.7" x2="177.0" y2="604.7" stroke="#2e7d32" stroke-width="2.5"/>
<text x="187.0" y="608.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">OUT</text>
<line x1="150.0" y1="592.0" x2="177.0" y2="592.0" stroke="#37474f" stroke-width="2.5"/>
<text x="187.0" y="596.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
<line x1="150.0" y1="579.3" x2="177.0" y2="579.3" stroke="#c62828" stroke-width="2.5"/>
<text x="187.0" y="583.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">VS</text>
<text x="135.0" y="596.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#eceff1">зворот</text>
<text x="135.0" y="504.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#212121">«зведений»</text>
<text x="135.0" y="488.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">у приливі кришки</text>
<rect x="820.0" y="516.0" width="110.0" height="44.0" rx="0" fill="#b0bec5" stroke="#212121" stroke-width="1.5"/>
<line x1="858.0" y1="592.0" x2="810.0" y2="592.0" stroke="#e0e0e0" stroke-width="16"/>
<polygon points="895.0,571.5 895.0,612.5 865.0,612.5 865.0,571.5" fill="#546e7a" stroke="#212121" stroke-width="1.5"/>
<line x1="865.0" y1="579.3" x2="838.0" y2="579.3" stroke="#2e7d32" stroke-width="2.5"/>
<text x="828.0" y="583.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">OUT</text>
<line x1="865.0" y1="592.0" x2="838.0" y2="592.0" stroke="#37474f" stroke-width="2.5"/>
<text x="828.0" y="596.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
<line x1="865.0" y1="604.7" x2="838.0" y2="604.7" stroke="#c62828" stroke-width="2.5"/>
<text x="828.0" y="608.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">VS</text>
<text x="880.0" y="596.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#eceff1">зворот</text>
<text x="926.0" y="504.0" font-size="12" text-anchor="end" font-weight="bold" fill="#212121">«розкритий»</text>
<text x="926.0" y="488.0" font-size="10" text-anchor="end" font-weight="normal" fill="#616161">у приливі гільзи («горбик» біля голови)</text>
<text x="470.0" y="530.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#212121">Маркування — ДО ГІЛЬЗИ, видно зворот. «Зведений» — ніжками до голови,</text>
<text x="470.0" y="546.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#212121">«розкритий» — до кришки (біля голови не загнути); його дроти — поверх приливу до голови.</text>
<text x="230.0" y="704.0" font-size="11" text-anchor="start" font-weight="bold" fill="#212121">переріз поперек гільзи по датчику, поршень (сталева гайка) на упорі:</text>
<circle cx="380.0" cy="790.0" r="60.0" fill="#455a64" stroke="#212121" stroke-width="1.5"/>
<polygon points="338.0,765.8 338.0,814.2 380.0,838.5 422.0,814.2 422.0,765.8 380.0,741.5" fill="white" stroke="#212121" stroke-width="1.2"/>
<rect x="327.5" y="778.0" width="16.0" height="24.0" rx="0" fill="white" stroke="#212121" stroke-width="0"/>
<polygon points="341.9,766.4 340.5,768.8 340.5,811.2 341.9,813.6 378.6,834.8 381.4,834.8 418.1,813.6 419.5,811.2 419.5,768.8 418.1,766.4 381.4,745.2 378.6,745.2" fill="#9e9e9e" stroke="#212121" stroke-width="1.2"/>
<circle cx="380.0" cy="790.0" r="24.2" fill="#cfd8dc" stroke="#212121" stroke-width="1.5"/>
<text x="380.0" y="794.0" font-size="9" text-anchor="middle" font-weight="bold" fill="#212121">M5</text>
<text x="380.0" y="866.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">поршень — сталева гайка M5 у шестигранному каналі</text>
<rect x="276.0" y="768.0" width="34.0" height="44.0" rx="0" fill="#b0bec5" stroke="#212121" stroke-width="1.5"/>
<rect x="304.0" y="770.0" width="16.0" height="40.0" rx="0" fill="#263238" stroke="#212121" stroke-width="1.5"/>
<line x1="318.0" y1="770.0" x2="318.0" y2="810.0" stroke="#ffca28" stroke-width="3"/>
<rect x="330.5" y="780.0" width="10.0" height="20.0" rx="0" fill="#c62828" stroke="#212121" stroke-width="1.5"/>
<line x1="180.0" y1="840.0" x2="316.0" y2="802.0" stroke="#212121" stroke-width="1.5"/>
<polygon points="316.0,802.0 308.2,808.2 306.1,800.7" fill="#212121"/>
<text x="174.0" y="846.0" font-size="10" text-anchor="end" font-weight="normal" fill="#212121">маркування — до гільзи</text>
<line x1="400.0" y1="720.0" x2="334.0" y2="782.0" stroke="#212121" stroke-width="1.5"/>
<polygon points="334.0,782.0 338.0,772.9 343.4,778.5" fill="#212121"/>
<text x="404.0" y="718.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212121">магніт Ø2×1 на грані гайки, полюс будь-який</text>
<line x1="180.0" y1="740.0" x2="288.0" y2="770.0" stroke="#212121" stroke-width="1.5"/>
<polygon points="288.0,770.0 278.1,771.3 280.2,763.8" fill="#212121"/>
<text x="174.0" y="744.0" font-size="10" text-anchor="end" font-weight="normal" fill="#212121">прилив, гніздо відкрите назовні</text>
<text x="640.0" y="740.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• SS49E лінійний: полюс магніту не важить, поріг і нуль — у прошивці після калібрування.</text>
<text x="640.0" y="758.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• Датчик сідає на клей врівень із дном гнізда; щілина між ним і гільзою — ворог сигналу.</text>
<text x="640.0" y="776.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• Ніжки згинати не ближче 1 мм від корпусу. Перед вклеюванням перевір маркування:</text>
<text x="640.0" y="794.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• SS41F і SS49E в одному корпусі — сплутати легко (41F — енкодер, 49E — кінцевики).</text>
<text x="40.0" y="924.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• Магніти енкодера — у передньому торці шестерні, під 180° один від одного, назовні різними полюсами (N і S):</text>
<text x="52.0" y="940.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">один притягується до пробного магніту, другий відштовхується. Тоді кожен латч дає меандр 50/50, пара — квадратуру.</text>
<text x="40.0" y="960.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• Кути — від напрямку на мотор (PHI у m5_cyl.scad); на схемі мотор праворуч. Масштаб не дотримано.</text>
