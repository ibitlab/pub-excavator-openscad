<text x="623.5" y="170.4" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">VS</text>
<text x="640.0" y="238.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#eceff1">зворот</text>
<text x="680.0" y="194.0" font-size="12" text-anchor="start" font-weight="bold" fill="#212121">латч A</text>
<text x="680.0" y="209.0" font-size="10" text-anchor="start" font-weight="normal" fill="#616161">PHI + 90°</text>
<line x1="558.0" y1="296.0" x2="520.0" y2="296.0" stroke="#e0e0e0" stroke-width="22"/>
<polygon points="597.5,269.4 597.5,322.6 558.5,322.6 558.5,269.4" fill="#546e7a" stroke="#212121" stroke-width="1.5"/>
