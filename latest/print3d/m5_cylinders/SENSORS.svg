<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="1010" fill="white"/>
<text x="40.0" y="40.0" font-size="18" text-anchor="start" font-weight="bold" fill="#212121">Циліндр M5 · датчики Холла: де стоять і як повернуті</text>
<text x="40.0" y="62.0" font-size="12" text-anchor="start" font-weight="normal" fill="#616161">однаково для стріли, рукояті й ковша; усі гнізда відкриті назовні — датчики вставляються після друку</text>
<rect x="30.0" y="84.0" width="360.0" height="330.0" rx="6" fill="#fafafa" stroke="#212121" stroke-width="1.5"/>
<text x="46.0" y="108.0" font-size="13" text-anchor="start" font-weight="bold" fill="#212121">1. Корпус SS41F і SS49E (пласкі TO-92)</text>
<polygon points="87.2,146.0 152.8,146.0 152.8,194.0 87.2,194.0" fill="#263238" stroke="#212121" stroke-width="1.5"/>
<line x1="99.7" y1="194.0" x2="99.7" y2="237.2" stroke="#c62828" stroke-width="2.5"/>
<text x="99.7" y="257.2" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">VS</text>
<line x1="120.0" y1="194.0" x2="120.0" y2="237.2" stroke="#37474f" stroke-width="2.5"/>
<text x="120.0" y="268.2" font-size="10" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
<line x1="140.3" y1="194.0" x2="140.3" y2="237.2" stroke="#2e7d32" stroke-width="2.5"/>
<text x="140.3" y="257.2" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">OUT</text>
<text x="120.0" y="174.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#ffca28">41F</text>
<text x="120.0" y="310.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#212121">сторона з маркуванням</text>
<text x="120.0" y="325.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#212121">до себе, ніжки донизу</text>
<polygon points="257.2,146.0 322.8,146.0 322.8,194.0 257.2,194.0" fill="#546e7a" stroke="#212121" stroke-width="1.5"/>
<line x1="269.7" y1="194.0" x2="269.7" y2="237.2" stroke="#2e7d32" stroke-width="2.5"/>
<text x="269.7" y="257.2" font-size="10" text-anchor="middle" font-weight="bold" fill="#2e7d32">OUT</text>
<line x1="290.0" y1="194.0" x2="290.0" y2="237.2" stroke="#37474f" stroke-width="2.5"/>
<text x="290.0" y="268.2" font-size="10" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
<line x1="310.3" y1="194.0" x2="310.3" y2="237.2" stroke="#c62828" stroke-width="2.5"/>
<text x="310.3" y="257.2" font-size="10" text-anchor="middle" font-weight="bold" fill="#c62828">VS</text>
<text x="290.0" y="174.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#eceff1">зворот</text>
<text x="290.0" y="310.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#212121">та сама, зі звороту</text>
<text x="290.0" y="325.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#212121">(як видно при вставлянні)</text>
<text x="46.0" y="350.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">Чутливий елемент — ближче до сторони з маркуванням;</text>
<text x="46.0" y="366.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">поле має входити в неї поперек корпусу.</text>
<text x="46.0" y="382.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">Тому маркування — завжди до магніту.</text>
<text x="46.0" y="398.0" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">Виводи в обох датчиків однакові: VS · GND · OUT.</text>
<rect x="410.0" y="84.0" width="760.0" height="330.0" rx="6" fill="#fafafa" stroke="#212121" stroke-width="1.5"/>
<text x="426.0" y="108.0" font-size="13" text-anchor="start" font-weight="bold" fill="#212121">2. Енкодер: 2 × SS41F у передній стінці голови — вид з боку носа (спереду)</text>
<path d="M 680 196 L 835 208 A 92 92 0 0 1 835 384 L 680 396 Z" fill="#90caf9" stroke="#212121" stroke-width="1.5"/>
