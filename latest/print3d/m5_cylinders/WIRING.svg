<text x="770" y="330" font-size="15" text-anchor="middle" font-weight="bold" fill="#212121">ESP32-C3</text>
<text x="770" y="350" font-size="15" text-anchor="middle" font-weight="bold" fill="#212121">SuperMini</text>
<text x="770" y="372" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">свій на кожен циліндр</text>
<text x="770" y="552" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">не займати:</text>
<text x="770" y="568" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">GPIO2 · GPIO8 · GPIO9</text>
<text x="735" y="668" font-size="10" text-anchor="middle" font-weight="normal" fill="#616161">USB-C — прошивка</text>
<text x="822" y="204" font-size="12" text-anchor="end" font-weight="normal" fill="#212121">GPIO20 RX</text>
<line x1="830" y1="200" x2="870" y2="200" stroke="#757575" stroke-width="2" stroke-dasharray="5 4"/>
