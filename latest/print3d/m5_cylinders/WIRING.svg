<text x="876" y="206" font-size="11" text-anchor="start" font-weight="normal" fill="#757575">до інших циліндрів: UART</text>
<text x="876" y="222" font-size="11" text-anchor="start" font-weight="normal" fill="#757575">або ESP-NOW — не вирішено</text>
