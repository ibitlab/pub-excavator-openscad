<text x="1081.25" y="636" font-size="11" text-anchor="middle" font-weight="bold" fill="#37474f">GND</text>
<text x="40" y="782" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• Усі GND — спільні. Однакові мітки (+5V, +3V3, +12V, GND) — одне коло.</text>
<text x="40" y="798" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• SS41F і SS49E: виводи VS · GND · OUT зліва направо, якщо дивитися на бік із маркуванням.</text>
<text x="40" y="814" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• SS49E живиться від +3V3: вихід 1.5–2.2 В, АЦП ESP32-C3 з ослабленням 12 дБ міряє до ~2.5 В.</text>
<text x="40" y="830" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• Пороги кінцевиків — у прошивці, після калібрування (README, «Підключення й керування»).</text>
<text x="40" y="846" font-size="11" text-anchor="start" font-weight="normal" fill="#424242">• USB і зовнішні 5 В одночасно — лише якщо на платі між ними є діод.</text>
<text x="1188" y="850" font-size="9" text-anchor="end" font-weight="normal" fill="#9e9e9e">Ihor Ivaniuk · @IBITLAB</text>
